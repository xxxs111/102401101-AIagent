<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>寻回 · 单元测试运行页</title>
<style>
  body { margin: 0; padding: 24px; background: #f4f6fb; color: #1b1f2a;
         font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #5a6478; font-size: 13px; margin-bottom: 16px; }
  .panel { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
           box-shadow: 0 2px 10px rgba(27,31,42,.06); }
  .bar { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-weight: 600; }
  .bar .n { font-size: 22px; }
  .ok { color: #16a34a; } .bad { color: #e5484d; } .mute { color: #98a1b3; font-weight: 400; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; border-bottom: 1px dashed #e9ecf3; }
  li:last-child { border-bottom: 0; }
  li::before { position: absolute; left: 0; }
  li.pass::before { content: '✔'; color: #16a34a; }
  li.fail::before { content: '✘'; color: #e5484d; }
  li.fail { color: #b42318; }
  .reason { display: block; color: #5a6478; font-size: 12.5px; padding-left: 2px; }
  .grp { margin: 18px 0 6px; font-weight: 700; color: #5a6478; font-size: 13px; }
  button { border: 0; border-radius: 8px; background: #4353ff; color: #fff;
           padding: 9px 16px; font-weight: 600; cursor: pointer; }
  code { background: #f1f3f9; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>寻回 · 校园失物招领 —— 单元测试</h1>
  <div class="sub">零框架、零依赖，原生 JS 手写断言。本页加载后自动运行 <code>test/unit-test.js</code>，刷新即重跑。</div>

  <div class="panel">
    <div class="bar">
      <span>用例总数 <span class="n" id="nTotal">-</span></span>
      <span class="ok">通过 <span class="n" id="nPass">-</span></span>
      <span class="bad">失败 <span class="n" id="nFail">-</span></span>
      <span class="mute" id="nCost">-</span>
      <button id="btnRun" style="margin-left:auto">重新运行</button>
    </div>
  </div>

  <div class="panel" id="results"></div>
</div>

<!-- 被测代码：逻辑层与模板层 -->
<script src="../js/utils.js"></script>
<script src="../js/store.js"></script>
<script src="../js/view.js"></script>
<!-- 测试用例 -->
<script src="unit-test.js"></script>
<script>
(function () {
  var listEl = document.getElementById('results');

  /* 把 runTest 的 console 输出静默掉，改为在页面上按分组渲染，方便截图 */
  function render() {
    var realLog = console.log;
    console.log = function () {};
    var summary;
    try { summary = runTest({ quiet: true }); } finally { console.log = realLog; }

    document.getElementById('nTotal').textContent = summary.total;
    document.getElementById('nPass').textContent = summary.passed;
    document.getElementById('nFail').textContent = summary.failed;
    document.getElementById('nCost').textContent = '耗时 ' + summary.cost + ' ms';

    var failedNames = {};
    summary.failures.forEach(function (f) { failedNames[f.name] = f.error.message; });

    /* 按用例名前缀（[Utils] / [校验] / [数据] / [搜索] / …）分组显示 */
    var groups = {};
    LFTest.cases.forEach(function (c) {
      var m = /^\[([^\]]+)\]/.exec(c.name);
      var g = m ? m[1] : '其它';
      (groups[g] = groups[g] || []).push(c.name);
    });

    var html = '';
    Object.keys(groups).forEach(function (g) {
      html += '<div class="grp">' + g + '（' + groups[g].length + ' 个用例）</div><ul>';
      groups[g].forEach(function (name) {
        var bad = Object.prototype.hasOwnProperty.call(failedNames, name);
        html += '<li class="' + (bad ? 'fail' : 'pass') + '">' + escapeHtml(name) +
          (bad ? '<span class="reason">原因：' + escapeHtml(failedNames[name]) + '</span>' : '') + '</li>';
      });
      html += '</ul>';
    });
    listEl.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.getElementById('btnRun').addEventListener('click', render);
  render();
})();
</script>
</body>
</html>
